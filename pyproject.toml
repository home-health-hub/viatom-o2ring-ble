[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viatom-o2ring-ble"
version = "0.1.0"
description = "Standalone Python BLE client for Viatom/Wellue ring pulse oximeters (live readings, file download, device config)"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22.0,<2.0.0",
    "bleak-retry-connector>=3.0.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/bonelifer/viatom-o2ring-ble"

[project.scripts]
viatom-o2ring = "viatom_o2ring_ble.cli:main"

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/viatom_o2ring_ble"]
