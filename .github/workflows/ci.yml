name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: flake8 --config .flake8 src tests

      - name: Test
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t viatom-o2ring-ble:ci .

      - name: Verify CLI
        run: |
          docker run --rm viatom-o2ring-ble:ci --version
          docker run --rm viatom-o2ring-ble:ci --help

      # Only publishes on pushes to main -- a PR's CI run builds and
      # verifies the image (above) but never reaches these steps, since
      # github.event_name is "pull_request" there, not "push".
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/viatom-o2ring-ble"
          docker tag viatom-o2ring-ble:ci "${image}:latest"
          docker tag viatom-o2ring-ble:ci "${image}:${{ github.sha }}"
          docker push "${image}:latest"
          docker push "${image}:${{ github.sha }}"
